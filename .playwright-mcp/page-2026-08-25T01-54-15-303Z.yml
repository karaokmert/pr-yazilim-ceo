          - generic [ref=f104e578]:
            - heading "Sehr netter und kompetenter Kontakt" [level=5] [ref=f104e579]
            - paragraph [ref=f104e581]: Sehr netter und kompetenter Kontakt. Mein Anliegen wurde schnell und vollständig gelöst! Danke! Sehr guter Kundennservice durch einen echten und kompetenten Mitarbeiter.
        - generic [ref=f104e582]:
