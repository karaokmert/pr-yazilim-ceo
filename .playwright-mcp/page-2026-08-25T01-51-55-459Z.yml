            - heading "Why choose Leaseweb Dedicated Servers?" [level=2] [ref=f13e274]
            - generic [ref=f13e275]:
              - generic [ref=f13e278]:
                - generic [ref=f13e279]:
                  - generic:
                    - img "secure-data-center-icon.svg"
                - generic [ref=f13e280]:
                  - heading "Secure housing" [level=3] [ref=f13e281]
                  - paragraph [ref=f13e282]: Housed in one of our top-tier ISO certified, hyper-connected data centers, our dedicated servers have it all. Every detail of their environment – from power density and redundancy, to capacity and cooling, location and accessibility – has been carefully configured to guarantee the very best in security, resiliency, and efficiency.
              - generic [ref=f13e285]:
                - generic [ref=f13e286]:
                  - generic:
                    - img "global-network-icon.svg"
                - generic [ref=f13e287]:
                  - heading "State-of-the-art global network" [level=3] [ref=f13e288]
                  - paragraph [ref=f13e289]: Get connected with greater bandwidth and speed, whenever and wherever you're working. One of the largest in the world, our network comprises 25 Internet Exchange peering points and 36 points of presence across Europe, the U.S. and Asia. Together with our combination of private peering and global transit provider arrangements we maintain an impressive core uptime of 99.999% and 5.5 Tbps available capacity.
              - generic [ref=f13e292]:
                - generic [ref=f13e293]:
                  - generic:
                    - img "command-control-icon.svg"
                - generic [ref=f13e294]:
                  - heading "Command and control" [level=3] [ref=f13e295]
                  - paragraph [ref=f13e296]: Our easy-to-use customer portal and API lets you manage your entire hosting infrastructure from one single interface. You’ll have access to automated backend services and activities to carry out server reboots, OS reloads, rescue modes, IP management, null routing, private network, data traffic and bandwidth measurements.
              - generic [ref=f13e299]:
                - generic [ref=f13e300]:
                  - generic:
                    - img "private-networking.svg"
                - generic [ref=f13e301]:
                  - heading "Private Networking" [level=3] [ref=f13e302]
                  - paragraph [ref=f13e303]: You can now connect your colocation rack to Dedicated Servers or your private cloud through our private networking feature. Through an easy implementation, you increase your connectivity internally without being connected to external networks or even the Internet. This is a hybrid setup that is both cost effective and secure.
              - generic [ref=f13e306]:
                - generic [ref=f13e307]:
                  - generic:
                    - img "supercharge-nvme-icon.svg"
                - generic [ref=f13e308]:
                  - heading "Supercharge with NVMe" [level=3] [ref=f13e309]
                  - paragraph [ref=f13e310]: Leaseweb's premium server range can also be upgraded with state-of-the-art NVMe SSD hard drives. NVMe (Non-Volitile Memory express) SSD enables you to increase availability from the drive by overcoming bottlenecks experienced in SAS (serial-attached SCSI) and SATA interfaces. NVMe SSD reduces I/O (Input/Output) overhead and delivers various performance enhancements, including multiple, long command queues, and reduced latency.
              - generic [ref=f13e313]:
                - generic [ref=f13e314]:
                  - generic:
