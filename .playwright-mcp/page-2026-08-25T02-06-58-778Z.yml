                    - generic [ref=f10e1509]:
                      - paragraph [ref=f10e1510]: "The price of a dedicated server will vary depending on a number of factors, such as the type of server, hardware specifications and operating system. The server can be single or dual processor. Ensure you opt for a solution that is equipped with the right level of hardware resources for your project: e.g., CPU, RAM, storage space, network. The volume of RAM, storage and processing power required will contribute to the overall cost of your machine."
                      - paragraph [ref=f10e1511]: "The type of operating system and any additional software you choose to install on the server may also affect the price. With our dedicated servers, we offer a selection of free open-source operating systems, as well as paid licences for the most popular options: Linux distributions such as Ubuntu, CentOS, Fedora and Debian, and the Windows Server operating system."
