                                - /url: https://www.ovh.com/auth/?onsuccess=https%3A//manager.eu.ovhcloud.com/%23/public-cloud%3Fcontext%3Dwebsite%26voucher%3DFREETRIAL&ovhSubsidiary=IE
                    - heading "Pricing model" [level=2] [ref=f7e6681]
                    - generic [ref=f7e6683]:
                      - img "Public cloud prices" [ref=f7e6688]
                      - generic [ref=f7e6690]:
                        - generic [ref=f7e6691]: Pay-as-you-go
                        - paragraph [ref=f7e6693]: All of our Public Cloud solutions are billed based on actual usage, which means you only pay for what you use. You launch the resources you need, when you need them, with no hidden costs. At the end of the month, we calculate your final bill, based on the resources you have used over that period, and deliver it as a single, clear invoice.
                    - generic [ref=f7e6698]:
                      - generic [ref=f7e6700]:
                        - heading "Contract duration" [level=3] [ref=f7e6701]
                        - paragraph [ref=f7e6703]: On-demand resources are non-binding. You can remove a resource at any time, after which you will not be billed for it. Likewise, instances with monthly billing can be stopped at any time, and only the months you use are billed (calculated on the basis of an instance existing on the 1st day of the month, at 00:00).
                      - generic [ref=f7e6705]:
                        - heading "Segmentation by project" [level=3] [ref=f7e6706]
                        - generic [ref=f7e6707]: For simplified administration of your operations, you can compartmentalise your Public Cloud solutions by project.
                      - generic [ref=f7e6709]:
                        - heading "One invoice" [level=3] [ref=f7e6710]
                        - generic [ref=f7e6711]: You will receive only one invoice per project. This is sent at the beginning of each month, based on the previous month’s usage.
