                              - generic [ref=f7e5176]:
                                - generic [ref=f7e5177]:
                                  - heading "On-demand pricing" [level=3] [ref=f7e5178]
                                  - text: New
                                - paragraph [ref=f7e5180]: A turnkey solution available as a self-service for all your Data and Analytics projects.
                                - link "Find out more" [ref=f7e5182] [cursor=pointer]:
                                  - /url: https://www.ovhcloud.com/en-ie/public-cloud/data-platform/
                            - generic [ref=f7e5184]:
                              - generic [ref=f7e5185]:
                                - paragraph [ref=f7e5186]: "The OVHcloud Data Platform offers pricing based on four dimensions: the computing power dedicated to query execution, data processing, application hosting, and the volume of data stored."
                                - paragraph [ref=f7e5187]: The computing power unit used to perform data processing and host applications is the Data Platform Unit (DPU), corresponding to 1 vCPU and 4 GB RAM.
                                - paragraph [ref=f7e5188]: With the OVHcloud Data Platform, you are billed per organisation, not per user. This way, you can add as many employees and end users to your organisation as you want.
                              - table [ref=f7e5189]:
