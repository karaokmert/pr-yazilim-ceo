                              - generic [ref=f7e5551]:
                                - heading "AI Deploy" [level=3] [ref=f7e5553]
                                - paragraph [ref=f7e5555]: Easily deploy machine learning models and applications to production, create your API access points effortlessly, and make effective predictions.
                                - link "Find out more" [ref=f7e5557] [cursor=pointer]:
                                  - /url: https://www.ovhcloud.com/en-ie/public-cloud/ai-deploy/
                            - generic [ref=f7e5558]:
                              - generic [ref=f7e5559]:
                                - generic [ref=f7e5560]:
                                  - paragraph [ref=f7e5561]: AI Deploy deploys your applications or models via Docker on a cluster, which then boots computing nodes (called replicas). Each deployment is defined by a minimum and maximum number of nodes, which you choose. Each node you launch is billed per minute, depending on its lifespan and power. The cluster will meet all your specifications, whether it is fixed or adapts automatically to the workload. To deploy a model into production, you can get a price estimate in the OVHcloud Control Panel. You have an unlimited number of deployment requests.
                                  - paragraph [ref=f7e5562]: For simplicity, the price displayed is the hourly price. However, the billing granularity is calculated per minute.
                                  - paragraph [ref=f7e5563]: "Rates include computing power, with the exception of:"
                                  - list [ref=f7e5564]:
                                    - listitem [ref=f7e5565]: Container registry costs to host images of containers deployed on your cluster. This service is billed in accordance with the conditions listed in the “Containers & Orchestration” section.
                                    - listitem [ref=f7e5566]: Data storage costs.
                                  - paragraph [ref=f7e5567]
                                  - paragraph [ref=f7e5568]:
                                    - strong [ref=f7e5569]: CPUs
                                  - paragraph [ref=f7e5570]: Get guaranteed CPU resources that are adapted to your test, pre-production and even basic machine learning phases.
                                  - paragraph [ref=f7e5571]: Deploy up to 12 resource units per node. Object Storage is unlimited.
