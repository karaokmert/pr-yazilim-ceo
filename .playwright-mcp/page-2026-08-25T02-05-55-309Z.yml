                                    - cell "Included" [ref=f7e5213]
                              - generic [ref=f7e5214]:
                                - paragraph [ref=f7e5215]: "With this on-demand model, billing is based on:"
                                - list [ref=f7e5216]:
                                  - listitem [ref=f7e5217]: the number of TB of data processed by each request, whether they are carried out in the data lakehouse or in Direct Query (to data outside the Data Platform) from the Analytics Manager
                                  - listitem [ref=f7e5218]: the number of DPUs used to perform actions with the Data Processing Engine or Application Services Usage is measured per second and billed per hour.
                                - paragraph [ref=f7e5219]: For each of your actions or applications, you can increase the number of DPUs allocated to speed up execution and improve processing reliability.
                                - paragraph [ref=f7e5220]: Storage pricing is the cost of retaining the data you upload to the Data Platform Data Lakehouse, measured in gigabytes (GB) of stored data. OVHcloud does not charge any additional fees for data transfer (incoming or outgoing).
