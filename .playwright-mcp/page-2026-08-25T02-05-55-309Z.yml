              - generic [ref=f7e6740]:
                - paragraph [ref=f7e6741]:
                  - text: "**This special offer is valid for new and renewed subscriptions for Public Cloud Compute, Block Storage, Network and Savings Plan services, available in 3-AZ Paris, from 1 April 2025, 00:00 until 28 February 2026, 23:59 (“Validity period”). The monthly rate is the price for a one-month Savings Plan. The monthly Windows rate covers a Windows licence ("
                  - generic [ref=f7e6742]: €0.0347 ex. VAT/vCore/hour
                  - text: ). The
                  - link "Savings Plans page" [ref=f7e6743] [cursor=pointer]:
                    - /url: https://www.ovhcloud.com/en-ie/public-cloud/savings-plan/
                  - text: lists rates for 6, 12, 24 and 36-month Plans.
                - paragraph [ref=f7e6744]: From 1 March 2026, the regular prices will apply. If you have subscribed for an eligible Savings Plan during the offer period, you will enjoy the discounted price for the length of your initial subscription. This only applies to your initial subscription’s length, and excludes any future Savings Plan renewals or subscriptions.
                - paragraph [ref=f7e6745]: Offer valid while stocks last and until you cancel your service. The time at which the order is processed by OVHcloud will be used as proof in the event of any disputes.
                - paragraph [ref=f7e6746]: This offer cannot be used in conjunction with any other discounts or special offers, and excludes optional add-ons.
